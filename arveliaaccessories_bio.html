<style>

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 16px;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at top,#ffdfeb 0,#fff1f6 48%,#fff9fb 100%)}
main{width:min(100%,420px);text-align:center;padding:30px 22px 24px;border:1px solid #f3d0dd;border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 18px 55px rgba(173,86,120,.14)}

p{font-size:14px;line-height:1.9;margin:0 0 23px;color:#906779}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:12px;width:100%;min-height:59px;padding:13px 15px;border-radius:16px;background:#fff;border:1px solid #f1d3df;color:var(--ink);text-decoration:none;font-size:15px;font-weight:700;transition:transform .15s,box-shadow .15s}
.link:hover{transform:translateY(-2px);box-shadow:0 8px 20px #ad56781c}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--pale);font-size:18px}
.arrow{margin-right:auto;color:#c27c98;font-size:22px}
footer{margin-top:22px;font-size:11px;color:#b28b9b}
